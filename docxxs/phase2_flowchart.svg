<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .box { fill:#eef4fb; stroke:#3a6ea5; stroke-width:1.5; rx:8; }
    .proc { fill:#fff7e6; stroke:#c98a1b; stroke-width:1.5; rx:8; }
    .out { fill:#eaf7ea; stroke:#2e8b57; stroke-width:1.5; rx:8; }
    .warn { fill:#fdecec; stroke:#c0392b; stroke-width:1.5; rx:8; }
    .edge { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    .lbl { fill:#222; }
    .small { font-size:11px; fill:#555; }
    .title { font-weight:600; }
  </style>

  <!-- Title -->
  <text x="590" y="28" text-anchor="middle" font-size="20" font-weight="700">Phase 2 — Signal Extraction Flow</text>

  <!-- Input -->
  <rect class="box" x="470" y="50" width="240" height="50"/>
  <text class="lbl title" x="590" y="72" text-anchor="middle">master.csv</text>
  <text class="lbl small" x="590" y="90" text-anchor="middle">(ticker, call_date, transcript_text, label)</text>

  <line class="edge" x1="590" y1="100" x2="590" y2="130"/>

  <!-- Split -->
  <rect class="proc" x="420" y="132" width="340" height="55"/>
  <text class="lbl title" x="590" y="155" text-anchor="middle">split_sections()</text>
  <text class="lbl small" x="590" y="174" text-anchor="middle">split at the 2nd "Operator:" turn</text>

  <line class="edge" x1="500" y1="187" x2="300" y2="230"/>
  <line class="edge" x1="680" y1="187" x2="880" y2="230"/>

  <!-- Prepared remarks branch -->
  <rect class="box" x="150" y="232" width="300" height="45"/>
  <text class="lbl title" x="300" y="260" text-anchor="middle">prepared_remarks text</text>

  <!-- QA branch -->
  <rect class="box" x="730" y="232" width="300" height="45"/>
  <text class="lbl title" x="880" y="260" text-anchor="middle">qa text</text>

  <line class="edge" x1="300" y1="277" x2="300" y2="310"/>
  <line class="edge" x1="880" y1="277" x2="880" y2="310"/>

  <!-- chunking -->
  <rect class="proc" x="150" y="312" width="300" height="55"/>
  <text class="lbl title" x="300" y="335" text-anchor="middle">chunk_by_tokens()</text>
  <text class="lbl small" x="300" y="354" text-anchor="middle">sentence-packed, &#8804;510 tokens</text>

  <rect class="proc" x="730" y="312" width="300" height="55"/>
  <text class="lbl title" x="880" y="335" text-anchor="middle">chunk_by_tokens()</text>
  <text class="lbl small" x="880" y="354" text-anchor="middle">sentence-packed, &#8804;510 tokens</text>

  <line class="edge" x1="300" y1="367" x2="300" y2="400"/>
  <line class="edge" x1="880" y1="367" x2="880" y2="400"/>

  <!-- FinBERT -->
  <rect class="proc" x="150" y="402" width="300" height="55"/>
  <text class="lbl title" x="300" y="425" text-anchor="middle">FinBERT per chunk</text>
  <text class="lbl small" x="300" y="444" text-anchor="middle">net sentiment = P(pos) - P(neg)</text>

  <rect class="proc" x="730" y="402" width="300" height="55"/>
  <text class="lbl title" x="880" y="425" text-anchor="middle">FinBERT per chunk</text>
  <text class="lbl small" x="880" y="444" text-anchor="middle">net sentiment = P(pos) - P(neg)</text>

  <line class="edge" x1="300" y1="457" x2="300" y2="490"/>
  <line class="edge" x1="880" y1="457" x2="880" y2="490"/>

  <!-- aggregate -->
  <rect class="out" x="150" y="492" width="300" height="55"/>
  <text class="lbl title" x="300" y="515" text-anchor="middle">mean / min / max / std</text>
  <text class="lbl small" x="300" y="534" text-anchor="middle">finbert_prepared_* (4 cols)</text>

  <rect class="out" x="730" y="492" width="300" height="55"/>
  <text class="lbl title" x="880" y="515" text-anchor="middle">mean / min / max / std</text>
  <text class="lbl small" x="880" y="534" text-anchor="middle">finbert_qa_* (4 cols)</text>

  <!-- whole-transcript branch (middle) -->
  <line class="edge" x1="590" y1="187" x2="590" y2="580"/>
  <rect class="proc" x="440" y="582" width="300" height="80"/>
  <text class="lbl title" x="590" y="605" text-anchor="middle">Whole-transcript features</text>
  <text class="lbl small" x="590" y="624" text-anchor="middle">LM dictionary %, fog_index,</text>
  <text class="lbl small" x="590" y="640" text-anchor="middle">numeric_density, forward_looking_count</text>
  <text class="lbl small" x="590" y="656" text-anchor="middle">(9 cols)</text>

  <!-- qa_directness needs qa text too -->
  <line class="edge" x1="880" y1="547" x2="880" y2="600"/>
  <line class="edge" x1="880" y1="600" x2="740" y2="622"/>
  <text class="lbl small" x="900" y="580" text-anchor="middle">qa text also feeds</text>
  <text class="lbl small" x="900" y="595" text-anchor="middle">qa_directness</text>

  <!-- merge -->
  <line class="edge" x1="300" y1="547" x2="500" y2="700"/>
  <line class="edge" x1="590" y1="662" x2="590" y2="700"/>
  <line class="edge" x1="880" y1="547" x2="680" y2="700"/>

  <rect class="out" x="390" y="702" width="400" height="55"/>
  <text class="lbl title" x="590" y="725" text-anchor="middle">features.csv</text>
  <text class="lbl small" x="590" y="744" text-anchor="middle">509 rows &#215; 17 features + ticker, call_date, label</text>

  <line class="edge" x1="590" y1="757" x2="590" y2="790"/>

  <!-- downstream -->
  <rect class="box" x="390" y="792" width="400" height="55"/>
  <text class="lbl title" x="590" y="815" text-anchor="middle">Phase 3 — Type Classifier</text>
  <text class="lbl small" x="590" y="834" text-anchor="middle">Logistic Regression &#8594; XGBoost, trained on features.csv + label</text>

  <!-- known limitation callout -->
  <rect class="warn" x="60" y="792" width="290" height="70"/>
  <text class="lbl small" x="205" y="812" text-anchor="middle" font-weight="600">Known limitation</text>
  <text class="lbl small" x="205" y="830" text-anchor="middle">4/509 rows have no 2nd "Operator:"</text>
  <text class="lbl small" x="205" y="846" text-anchor="middle">turn &#8594; NaN finbert_qa_*/qa_directness</text>
  <line class="edge" x1="350" y1="820" x2="390" y2="815" stroke-dasharray="4,3"/>

</svg>
